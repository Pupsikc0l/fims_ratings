<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">

    <script src="js/app.js" defer></script>
</head>
<body>
    <div class="wrapper">


        <header class="header">
            <div class="header-wrapper">
                <span class="header-logo">RATe</span>
                <nav class="header__nav">
                    <ul class="ul-list">
                        <li><p>Заглушка</p></li>
                        <li><p>Заглушка</p></li>
                        <li><p>Заглушка</p></li>
                        <li><p>Заглушка</p></li>
                    </ul>
                </nav>
            </div> 
        </header>
            
            <button class="showPopup">Создать фильм</button>
        
            <div class="films">

                <h1 class="films__title">Your list of films</h1>

                <div class="films-list">
                    <!-- список фильмов -->
                </div>

            </div>

        <!-- попап с добавлением фильма -->
        <dialog class="addFilm" aria-labelledby="addFilmTitle">
            <h3 class="addFilm__title">Add your film</h3>
            <form class="addFilm__form">

                <div class="addFilm__field">
                    <label for="filmPoster" class="addFilm__dropZone">
                        <span class="addFilm__dropZone-text">Перетащи постер сюда или кликни</span>
                        <img class="addFilm__preview" alt="Превью постера">
                    </label>
                    <input type="file" id="filmPoster" accept="image/*" required>
                </div>

                <div class="addFilm__field">
                    <label for="filmName">Название</label>
                    <input type="text" name="filmName" id="filmName">
                </div>

                <div class="addFilm__field">
                    <label for="filmLength">Длительность фильма</label>
                    <input type="text" name="filmLength" id="filmLength">
                </div>
                
                <div class="addFilm__field addFilm__field-rate">
                    <label for="filmRate">Оценка</label>
                    <div class="addFilm__rate-row">
                        <input type="range" name="filRate" id="filmRate" min="0" max="10" value="5" step="0.1">
                        <output for="filmRate">5.0</output>
                    </div>
                </div>

                <div class="addFilm__actions">
                    <button type="submit">Создать фильм</button>
                    <button class="closeDialogButtton" type="button">Отмена</button>
                </div>
            </form>
        </dialog>
    </div>


    <!-- пример карточки фильма -->
    <template id="filmTemplate">
            <article class="film-card">
                    <div class="film-card__poster">
                        <img src="public/images/film-blue.png" alt="Постер фильма Azure Ray" loading="lazy">
                    </div>
                    <h2 class="film-card__title">Azure Ray</h2>
                    <ul class="film-card__info">
                        <li class="film-card__rate">Rate: 3.5 / 10</li>
                        <li class="film-card__length">Length: 1 hour 35 minutes</li>
                    </ul>
                    <div class="film-card__actions">
                        <button class="film-card__btn film-card__btn--watched">Просмотрено</button>
                        <button class="film-card__btn film-card__btn--watch">Смотреть</button>                        
                    </div>  
            </article>  
    </template>
</body>
</html>
